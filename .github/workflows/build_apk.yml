name: Build Android APK (AEGS VPN Mobile)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build AEGS Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug --stacktrace

      - name: Find and Rename APK
        run: |
          mkdir -p output_apk
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/AEGS-v6.0-titan.apk \;
          ls -la output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AEGS-v6.0-titan-apk
          path: output_apk/AEGS-v6.0-titan.apk

      - name: Attach APK to GitHub Release v6.0-titan
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v6.0-titan
          files: output_apk/AEGS-v6.0-titan.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
