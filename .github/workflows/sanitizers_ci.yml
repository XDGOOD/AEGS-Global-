name: AEGS-Global CI & Cloud Sanitizer Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Linux ASAN + UBSAN & Memory Safety (Cloud Bare-Metal Runner)
  # --------------------------------------------------------------------------
  sanitizers-asan-ubsan:
    name: ASAN + UBSAN & Memory Safety
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake libssl-dev libsqlite3-dev python3 python3-pip

      - name: Configure CMake with ASan + UBSan
        run: |
          cmake -B build_asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON

      - name: Build aegs_server under ASan
        run: cmake --build build_asan --target aegs_server -j2

      - name: Build aegs_client under ASan
        run: cmake --build build_asan --target aegs_client -j2

      - name: Build bench_hotpath under ASan
        run: cmake --build build_asan --target bench_hotpath -j2

      - name: Build aegs_test under ASan
        run: |
          cmake --build build_asan --target aegs_test -j2 > test_build.log 2>&1 || (python3 -c "import sys; print('::error file=test_runner.cpp::' + open('test_build.log').read().replace('\n', '%0A'))" && exit 1)

      - name: Build aegs_fuzz under ASan
        run: |
          cmake --build build_asan --target aegs_fuzz -j2 > fuzz_build.log 2>&1 || (cat fuzz_build.log && exit 1)

      - name: Run Core Suite under ASan + UBSan
        run: |
          ./build_asan/aegs_test

      - name: Run Protocol Fuzzer Smoke under ASan + UBSan
        run: |
          ./build_asan/aegs_fuzz 50000

  # --------------------------------------------------------------------------
  # Job 2: ThreadSanitizer (TSAN) & Concurrency Multi-Core Validation
  # --------------------------------------------------------------------------
  sanitizers-tsan:
    name: TSAN Data Race & Deadlock Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake libssl-dev libsqlite3-dev

      - name: Configure CMake with TSAN
        run: |
          cmake -B build_tsan -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=ON

      - name: Build Concurrency Stress Target
        run: |
          cmake --build build_tsan --target test_concurrency_stress -j2

      - name: Run 10-Thread Concurrency Stress under TSAN
        run: |
          TSAN_OPTIONS="second_deadlock_stack=1 halt_on_error=1" ./build_tsan/test_concurrency_stress

  # --------------------------------------------------------------------------
  # Job 3: Multicore Scaling & Micro-Benchmarks
  # --------------------------------------------------------------------------
  benchmarks:
    name: Multicore Benchmarks & Hotpath Scaling
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake libssl-dev libsqlite3-dev

      - name: Configure and Build Benchmarks (Release -O3)
        run: |
          cmake -B build_bench -DCMAKE_BUILD_TYPE=Release
          cmake --build build_bench --target bench_hotpath bench_multicore -j2

      - name: Run Single-Thread Hotpath Microbenchmark
        run: |
          ./build_bench/bench_hotpath

      - name: Run Multicore Scaling & Capacity Benchmark
        run: |
          ./build_bench/bench_multicore

  # --------------------------------------------------------------------------
  # Job 4: Security, Attack & Chaos Test Suites (Python Bare-Metal)
  # --------------------------------------------------------------------------
  security-and-chaos:
    name: 12-Pillars Security, Attacks & Chaos Suites
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cryptography requirement
        run: |
          pip install cryptography

      - name: Run 12-Pillar Advanced Security Suite
        run: |
          python test_suite_v4.py

      - name: Run Attack Defense Verification Harness (9/9)
        run: |
          python run_attack_tests.py

      - name: Run Network Chaos Simulator (5/5 Fail-Closed)
        run: |
          python tests/chaos_runner.py

      - name: Run Long-Term Soak Test Smoke
        run: |
          python tests/soak_runner.py --duration 30 --sessions 1000 --interval 5
